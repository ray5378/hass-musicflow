name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c 'import json;print(json.load(open("custom_components/musicflow/manifest.json"))["version"])')"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          fi
          echo "manifest version ${MANIFEST_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## MusicFlow Home Assistant integration — ${{ github.ref_name }}

            Install/update via HACS (MusicFlow custom repository).

            ### 本版 —— 修复 JWT 认证重试无限递归；最低核心版本声明收紧到 HA 2025.5

            修复「服务端持续返回 401/403 时，集成侧请求重试无限递归到 RecursionError」。

            - **根因**：`_request` 的「只重试一次」守卫用的是实例状态 `self._retried`，
              而 `login()` 每次成功登录都会把它复位为 `False`。当 JWT 被吊销 / 过期、用户名
              密码仍能登录成功、但目标接口持续返回 401/403 时，重试会一直递归下去，直到
              `RecursionError` —— 本意的 `MusicFlowAuthError`（如实报错）永远不可达。
            - **改动**：把「本次调用还允许重试一次」的标记改为由递归调用自己携带的参数
              `_retry_auth`，不再依赖实例状态。既修掉无限递归，也顺带消除并发请求之间
              互相踩标记的问题；持续认证失败时现在会如实抛出 `MusicFlowAuthError`。
            - **声明**：`hacs.json` 的最低核心版本声明从 2024.12 收紧到 **2025.5**，如实反映
              代码对 HA 2025.5 媒体搜索 API（`SearchMedia` / `SearchMediaQuery`）的硬依赖，
              避免在旧核心上安装后直接 import 失败。
            - **门禁**：集成侧新增 `pytest` + HA 官方测试框架单测与 60% 覆盖率四维硬门禁，
              以独立 `Test` workflow 阻塞合并；新增回归守卫用例锁定「持续 401/403 恰好重试
              一次后抛 MusicFlowAuthError」，并通过反向变异验证判红。

            ### 配套
            - 需 **Home Assistant 2025.5 及以上**（曲库内搜索使用 HA 2025.5 才提供的媒体搜索 API）。
            - 集成侧实体建模、控制面端点与请求方式均无变化，**无需重新配置**。

            ### 兼容性
            - 需 **Home Assistant 2025.5 及以上**；在更早的核心上加载会因缺少媒体搜索 API 而失败。

            ### 升级步骤
            1. HACS 中更新本集成
            2. 重启 Home Assistant，或重新加载 MusicFlow 集成
            3. 确认实体正常、媒体库内搜索可用
          draft: false
          prerelease: false
