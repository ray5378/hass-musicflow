name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c 'import json;print(json.load(open("custom_components/musicflow/manifest.json"))["version"])')"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          fi
          echo "manifest version ${MANIFEST_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## MusicFlow Home Assistant integration — ${{ github.ref_name }}

            Install/update via HACS (MusicFlow custom repository).

            ### 本版 —— 修复 MusicFlow 容器重启后音量被回放成旧值

            实测现象：MusicFlow 容器重启后，设备音量被打回旧值（用户反馈为「强制 20」）。

            - **根因**：后端重启时 `/v1/peers` 会瞬时缺少 peer，集成按「peer 消失即剪实体」的逻辑
              立刻移除 HA 实体；peer 回归后实体重新注册，HA 在实体注册时回放上次状态的
              `volume_level`，把设备音量打回旧快照。
            - **改动**：实体剪枝增加 **120s 恢复窗口** —— 窗口内不剪、后端本轮不可达时整轮不剪；
              真正被用户隐藏/删除的 peer 过了窗口仍会照常清理。恢复窗口内 peer 回归 = 实体不销毁
              重建 = HA 不会回放音量。
            - **行为**：删除/隐藏 peer 的清理最多延后 120s；其余控制面完全不变。
            - **门禁**：实体剪枝用例覆盖「短暂缺失不剪、超过窗口才剪」，全量 293 例通过，覆盖率 97.91%。

            ### 配套
            - 服务端自 **MusicFlow v4.6.54** 起把 AirPlay 音量/静音落库（`airplay_device_state`），
              重启后以持久值播种，不再回落到缺省值。建议同时升级服务端。

            ### 兼容性
            - 需 **Home Assistant 2025.5 及以上**；集成侧实体建模、控制面端点与请求方式均无变化。

            ### 升级步骤
            1. HACS 中更新本集成
            2. 重启 Home Assistant，或重新加载 MusicFlow 集成
            3. 确认实体正常、媒体库内搜索可用
          draft: false
          prerelease: false
