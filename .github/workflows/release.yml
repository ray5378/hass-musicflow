name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify manifest version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(python3 -c 'import json;print(json.load(open("custom_components/musicflow/manifest.json"))["version"])')"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          fi
          echo "manifest version ${MANIFEST_VERSION} matches tag ${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            ## MusicFlow Home Assistant integration — ${{ github.ref_name }}

            Install/update via HACS (MusicFlow custom repository).

            ### 本版
            - **lockstep 对齐发布**:与 **MusicFlow 服务端 v4.0.6** / **客户端 v5.0.22** 配套。
              本仓代码无功能变更,版本号对齐用于让四个关联仓库的发布状态可追溯
              (集成 / 卡片 / 服务端 / 客户端同一批次)。
            - 服务端 v4.0.6 把进度条跳转(sendspin / DLNA)按 Music Assistant 语义重做
              —— seek 由「在流里挪指针」改为「用新起点重建一条流」,并根治了 ffmpeg
              孤儿泄漏;AirPlay 取流通道也已从 DLNA 路由中独立出来。集成侧的实体建模、
              控制面端点与 seek 调用方式均无变化。

            ### 兼容性
            - 需配合 **MusicFlow 服务端 v4.0.6+** 与 **客户端 v5.0.22+**;
              更早的服务端仍能连接,但跳转进度的行为以服务端为准。
          draft: false
          prerelease: false
