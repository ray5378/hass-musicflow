name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catch breakage caused by new Home Assistant releases.
    - cron: "0 3 * * 1"

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # "brands" requires the domain to be registered in home-assistant/brands,
          # which only applies to integrations shipped in the HACS default store.
          ignore: brands

  imports:
    name: Import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Home Assistant
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant

      - name: Import every module
        # py_compile only checks syntax. Importing is what catches things like
        # referencing a Platform enum member that does not exist, which breaks
        # the integration at load time with an AttributeError.
        run: |
          python - <<'PY'
          import importlib
          import homeassistant.const as hc

          print("Home Assistant:", hc.__version__)

          modules = [
              "const",
              "api",
              "browse_media",
              "coordinator",
              "config_flow",
              "media_player",
              "media_source",
              "__init__",
          ]
          for name in modules:
              importlib.import_module(f"custom_components.musicflow.{name}")
              print("imported ok:", name)

          # Every platform we forward must be a real entity platform.
          from custom_components.musicflow import PLATFORMS
          valid = {p.value for p in hc.Platform}
          for platform in PLATFORMS:
              assert platform in valid, f"{platform} is not a valid entity platform"
          print("PLATFORMS ok:", [str(p) for p in PLATFORMS])

          # media_source is wired through this module-level hook, not PLATFORMS.
          from custom_components.musicflow.media_source import async_get_media_source
          assert callable(async_get_media_source)
          print("media_source hook ok")
          PY

      - name: Regression check - CONFIG_SCHEMA must be a real schema
        # 1.3.0-1.3.2 shipped `CONFIG_SCHEMA = cv.config_entry_only_config_schema`
        # (the bare function, never called with DOMAIN). HA then received a
        # function instead of a schema, the integration failed to load
        # ("未加载") and the config flow returned HTTP 500. hassfest only checks
        # that the symbol exists, so CI stayed green. This asserts the value is
        # a callable config validator - NOT the uncalled factory function - and
        # that it actually validates a config dict the way HA does at load time.
        run: |
          python - <<'PY'
          from homeassistant.helpers import config_validation as cv
          from custom_components.musicflow import CONFIG_SCHEMA

          # The exact regression: assigning the factory without calling it.
          assert CONFIG_SCHEMA is not cv.config_entry_only_config_schema, (
              "CONFIG_SCHEMA is the bare cv.config_entry_only_config_schema "
              "function - it must be called with DOMAIN, e.g. "
              "cv.config_entry_only_config_schema(DOMAIN)"
          )
          # HA calls CONFIG_SCHEMA(config) and expects a dict back. The exact
          # return type differs between HA versions (a vol.Schema in older ones,
          # a Callable[[dict], dict] in newer ones), so check behavior, not type.
          assert callable(CONFIG_SCHEMA), "CONFIG_SCHEMA must be callable"
          try:
              result = CONFIG_SCHEMA({})
          except Exception as err:
              raise AssertionError(
                  f"CONFIG_SCHEMA({{}}) raised {err!r} - it is not a real "
                  "config validator"
              ) from err
          assert isinstance(result, dict), (
              f"CONFIG_SCHEMA({{}}) must return a dict, got {type(result)}"
          )
          print("CONFIG_SCHEMA regression check ok")
          PY
