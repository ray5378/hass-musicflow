[pytest]
# 单元测试 + 覆盖率门禁（阻塞式）。
#
# asyncio_mode=auto：integration 里几乎所有 I/O 方法都是 async，自动识别省去
# 每个用例手写 @pytest.mark.asyncio。
# -p pytest_homeassistant_custom_component：注册 HA 官方测试框架插件
#   （提供 hass / enable_custom_integrations / MockConfigEntry 等）。
# --cov-fail-under=60：覆盖率硬门禁，达不到即判红。
asyncio_mode = auto
# 显式指定异步 fixture 的事件循环作用域，避免 pytest-asyncio 的默认行为在未来变更。
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts =
    -p pytest_homeassistant_custom_component
    --cov=custom_components/musicflow
    --cov-report=term-missing
    --cov-fail-under=60
