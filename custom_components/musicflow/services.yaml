play_content:
  name: 播放内容
  description: >-
    让指定播放器播放一个歌单 / 专辑 / 艺术家 / 流派 / 单曲。
    起点定位优先用 song_id（按歌曲身份定位，与排序无关）；不传时退回 start_index（行号）。
  target:
    entity:
      integration: musicflow
      domain: media_player
  fields:
    content_type:
      required: true
      example: playlist
      selector:
        select:
          options:
            - song
            - album
            - playlist
            - artist
            - genre
    content_id:
      required: true
      example: "3f1c2b8a-..."
      selector:
        text:
    song_id:
      description: >-
        从这个内容里哪首歌开始播（歌曲 id）。按身份定位，与前后端排序无关，
        是**推荐的起点指定方式**。该曲不在解析出的队列里时服务端返回 404。
      example: "8a2f0c91-..."
      selector:
        text:
    start_index:
      description: >-
        从这个内容里第几行开始播（从 0 计数）。行号依赖队列排序序，
        前后端排序不同源时可能播错歌；仅在无法提供 song_id 时使用。
      default: 0
      selector:
        number:
          min: 0
          max: 9999
          mode: box
    play_mode:
      description: 起播时同时设定的播放模式（order 顺序 / one 单曲 / all 列表循环 / shuffle 随机）。
      selector:
        select:
          options:
            - order
            - one
            - all
            - shuffle
    enqueue:
      description: true 时把内容追加到现有队列末尾，而不是替换当前队列。
      default: false
      selector:
        boolean:

set_play_mode:
  target:
    entity:
      integration: musicflow
      domain: media_player
  fields:
    play_mode:
      required: true
      example: shuffle
      selector:
        select:
          options:
            - order
            - one
            - all
            - shuffle

clear_queue:
  target:
    entity:
      integration: musicflow
      domain: media_player

like_track:
  name: 喜欢 / 取消喜欢当前曲目
  description: 把当前播放的歌曲加入或移出「我喜欢的音乐」。不传 liked 则为切换。
  target:
    entity:
      integration: musicflow
      domain: media_player
  fields:
    liked:
      description: true=收藏, false=取消收藏。不传则按当前状态切换。
      example: true
      selector:
        boolean:

add_to_playlist:
  name: 添加到歌单
  description: 把当前播放的歌曲(或指定的 song_ids)追加到指定歌单。
  target:
    entity:
      integration: musicflow
      domain: media_player
  fields:
    playlist_id:
      required: true
      description: 目标歌单 id(可在实体属性或 MusicFlow 网页中查看)。
      example: "pl-1720000000000"
      selector:
        text:
    song_ids:
      description: 要添加的歌曲 id 列表。缺省时添加当前播放的歌曲。
      example: '["3f1c2b8a-..."]'
      selector:
        object:
